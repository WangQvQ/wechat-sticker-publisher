name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/inspect_images.py examples/goose/gifs --width 240 --height 240 --expect-count 16 --require-animation --require-loop --require-transparency --max-bytes 500000 --output example-checks.json
